name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. Chạy Unit Tests tự động trước khi deploy
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

  # 2. Tự động deploy lên VPS qua SSH khi Tests vượt qua
  deploy:
    name: Deploy to Production VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and Update Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -e

            # Tự động tìm thư mục chứa dự án trên VPS (hỗ trợ cả chữ hoa PY_IMAP và chữ thường py_imap)
            PROJECT_DIR=""
            for p in "/root/py_imap" "/root/PY_IMAP" "/opt/py_imap" "/opt/PY_IMAP" "$HOME/py_imap" "$HOME/PY_IMAP" "/var/www/py_imap" "/var/www/PY_IMAP" "/data/py_imap" "/data/PY_IMAP"; do
              if [ -d "$p" ]; then
                PROJECT_DIR="$p"
                break
              fi
            done

            # Nếu chưa thấy, tự động quét tìm thư mục chứa docker-compose.yml của project
            if [ -z "$PROJECT_DIR" ]; then
              FOUND=$(find /root /opt /home /var/www /data -maxdepth 4 -name "docker-compose.yml" -exec grep -l "email_migrator" {} + 2>/dev/null | head -n 1)
              if [ -n "$FOUND" ]; then
                PROJECT_DIR=$(dirname "$FOUND")
              fi
            fi

            if [ -n "$PROJECT_DIR" ] && [ -d "$PROJECT_DIR" ]; then
              echo "📁 Đã tìm thấy thư mục dự án tại: $PROJECT_DIR"
              cd "$PROJECT_DIR"
            else
              echo "⚠️ Không tìm thấy thư mục dự án. Danh sách thư mục hiện có trong /root:"
              ls -la /root
              exit 1
            fi

            echo "📥 Đang kéo code mới từ nhánh main..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 Đang build và khởi động lại Docker containers..."
            docker compose down --remove-orphans
            docker compose up -d --build

            echo "✅ Deploy hoàn tất thành công trên VPS!"
