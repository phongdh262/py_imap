name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. Chạy Unit Tests tự động trước khi deploy
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

  # 2. Tự động deploy lên VPS qua SSH khi Tests vượt qua
  deploy:
    name: Deploy to Production VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and Update Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -e

            # Thư mục chứa project trên VPS (mặc định /root/PY_IMAP hoặc /opt/PY_IMAP)
            if [ -d "/root/PY_IMAP" ]; then
              cd /root/PY_IMAP
            elif [ -d "/opt/PY_IMAP" ]; then
              cd /opt/PY_IMAP
            elif [ -d "$HOME/PY_IMAP" ]; then
              cd "$HOME/PY_IMAP"
            else
              echo "⚠️ Không tìm thấy thư mục PY_IMAP tại /root/PY_IMAP hoặc /opt/PY_IMAP"
              exit 1
            fi

            echo "📥 Đang kéo code mới từ nhánh main..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 Đang build và khởi động lại Docker containers..."
            docker compose down --remove-orphans
            docker compose up -d --build

            echo "✅ Deploy hoàn tất thành công trên VPS!"
