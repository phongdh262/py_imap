services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email_migrator_app
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8080:8080"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - ENABLE_WEB_AUTH=${ENABLE_WEB_AUTH:-true}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    volumes:
      - migrator_logs:/var/log/email_migrator
      - ./config:/app/config:ro
      - ./reports:/app/reports
      - ./data:/app/data
    networks:
      - phongdh_network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: email_migrator_prometheus
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
    networks:
      - phongdh_network

  loki:
    image: grafana/loki:3.0.0
    container_name: email_migrator_loki
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - phongdh_network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: email_migrator_promtail
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - migrator_logs:/var/log/email_migrator:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - phongdh_network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: email_migrator_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=Asia/Ho_Chi_Minh
      - GF_DATE_FORMATS_USE_BROWSER_LOCALE=true
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-Admin@Migration2026!}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - phongdh_network

networks:
  phongdh_network:
    external: true

volumes:
  migrator_logs:
  prometheus_data:
  loki_data:
  grafana_data:
