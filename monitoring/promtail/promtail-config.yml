server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: email_migrator_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: email_migrator
          env: production
          __path__: /var/log/email_migrator/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            event: event
            source_account: source_account
            dest_account: dest_account
            folder: folder
            error_code: error_code
            error_detail: error_detail
      - labels:
          level:
          source_account:
          folder:
          error_code:
      - timestamp:
          source: timestamp
          format: RFC3339
